<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Учитель Слов</title>
  <style>
    * { box-sizing: border-box; user-select: none; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; background: #131f24; color: #fff; display: flex; flex-direction: column; min-height: 100dvh; max-width: 480px; margin: 0 auto; }
    
    .screen { display: flex; flex-direction: column; width: 100%; gap: 10px; }
    .hidden { display: none !important; }
    
    .header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; margin-bottom: 6px; gap: 8px; }
    .btn-exit { background: #ea2b2b; border: 1px solid #ff4b4b; color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-dir { background: #202f36; border: 1px solid #1cb0f6; color: #1cb0f6; padding: 6px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    
    .menu-title { text-align: center; font-size: 24px; margin: 0 0 12px 0; color: #58cc02; }
    .dict-selector-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
    .dict-select { background: #202f36; border: 2px solid #1cb0f6; border-radius: 10px; color: #fff; padding: 10px; font-size: 15px; font-weight: bold; outline: none; width: 100%; }
    .menu-btn { background: #202f36; border: 2px solid #37464f; border-bottom-width: 4px; color: #fff; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: bold; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    
    .file-label { display: block; background: #202f36; border: 2px dashed #1cb0f6; border-radius: 12px; padding: 12px; color: #1cb0f6; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
    input[type="file"] { display: none; } 
    textarea { width: 100%; height: 50px; background: #202f36; border: 1px solid #37464f; border-radius: 8px; color: #fff; padding: 8px; font-size: 12px; resize: none; }
    .status { font-size: 13px; color: #afb8c1; text-align: center; }
    
    .btn { background: #58cc02; border: none; border-bottom: 4px solid #46a302; color: #fff; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; }
    .btn-export { background: #ffc800; border-bottom-color: #d7a800; color: #131f24; }
    .btn-delete-learned { background: #202f36; border: 1px solid #ea2b2b; color: #ff4b4b; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; }
    
    .quiz-prompt { background: #202f36; border: 2px solid #37464f; border-radius: 16px; padding: 16px; text-align: center; font-size: 22px; font-weight: bold; min-height: 70px; display: flex; align-items: center; justify-content: center; }
    .input-field { width: 100%; background: #202f36; border: 2px solid #37464f; border-radius: 12px; padding: 14px; color: #fff; font-size: 16px; text-align: center; outline: none; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    .modal-box { background: #202f36; border: 2px solid #37464f; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
    .modal-title { font-size: 18px; font-weight: bold; color: #58cc02; text-align: center; }
    .modal-row { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
    .modal-num-input { background: #131f24; border: 1px solid #37464f; border-radius: 8px; color: #fff; padding: 10px; font-size: 16px; width: 100%; text-align: center; }
    .modal-checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
    .modal-checkbox-label input { width: 18px; height: 18px; cursor: pointer; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
    .btn-modal-cancel { background: #37464f; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-modal-confirm { background: #ea2b2b; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
    .card-match { background: #202f36; border: 2px solid #37464f; border-bottom-width: 4px; border-radius: 12px; padding: 10px; text-align: center; font-size: 15px; font-weight: bold; cursor: pointer; min-height: 55px; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; }
    .card-match.selected { background: #1899d6; border-color: #1cb0f6; } 
    .card-match.correct { background: #46a302; border-color: #58cc02; } 
    .card-match.wrong { background: #ea2b2b; border-color: #ff4b4b; } 
    .card-match.cooldown { pointer-events: none; opacity: 0.6; }
    
    .quiz-options { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .quiz-opt { background: #202f36; border: 2px solid #37464f; border-bottom-width: 4px; border-radius: 12px; padding: 14px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; }
    .quiz-opt.correct { background: #46a302; border-color: #58cc02; } 
    .quiz-opt.wrong { background: #ea2b2b; border-color: #ff4b4b; }
    
    .flash-card { background: #202f36; border: 2px solid #37464f; border-radius: 16px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; cursor: pointer; }
    .flash-word { font-size: 28px; font-weight: bold; } 
    .flash-sub { font-size: 14px; color: #1cb0f6; margin-top: 10px; }
    .flash-controls { display: flex; flex-direction: column; gap: 8px; }
    .flash-controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-know { background: #58cc02; border-bottom-color: #46a302; } 
    .btn-dont { background: #ea2b2b; border-bottom-color: #ff4b4b; }
    .btn-exact { background: #1cb0f6; border-bottom-color: #1482b8; color: #fff; }
    .btn-skip { background: #37464f; border-bottom-color: #273238; color: #afb8c1; }
    .flash-stats { font-size: 13px; color: #afb8c1; text-align: center; }
  </style>
</head>
<body>

  <div id="screen-menu" class="screen">
    <h1 class="menu-title">Учитель Слов</h1>
    
    <div class="dict-selector-container">
      <select id="dict-select" class="dict-select" onchange="switchDictionary(this.value)">
        <option value="" disabled selected>— Нет загруженных словарей —</option>
      </select>
    </div>

    <div class="status" id="menu-status">Загрузка...</div>
    <button class="menu-btn" onclick="startMode('match')">⚡ Match Madness (Пары) <span>➔</span></button>
    <button class="menu-btn" onclick="startMode('quiz')">🎯 4 Варианта <span>➔</span></button>
    <button class="menu-btn" onclick="startMode('cards')">🎴 Флеш-карточки <span>➔</span></button>
    <button class="menu-btn" onclick="startMode('input')">⌨️ Ввод с клавиатуры <span>➔</span></button>

    <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">
      <button class="btn-delete-learned" onclick="openDeleteModal()">🗑️/📤 ОЧИСТКА ВЫУЧЕННЫХ</button>
      <label for="file-input" class="file-label">📂 ЗАГРУЗИТЬ JSON (СЛОВАРЬ ИЛИ БЭКАП)</label>
      <input type="file" id="file-input" accept=".json,.txt" onchange="loadFile(event)">
      <textarea id="text-input" placeholder="Или вставьте JSON сюда..." oninput="parseInputText(this.value)"></textarea>
      <button class="btn btn-export" onclick="exportJSON()">💾 СКАЧАТЬ ВСЕ СЛОВАРИ И ПРОГРЕСС</button>
    </div>
  </div>

  <div id="modal-delete" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">Фильтр выученных слов</div>
      <div class="modal-row">
        <label>Удалить/Выгрузить слова, верно отвеченные не менее (N) раз:</label>
        <input type="number" id="modal-n-count" class="modal-num-input" value="10" min="0" max="50">
      </div>
      <label class="modal-checkbox-label">
        <input type="checkbox" id="modal-chk-export" checked> 📤 Скачать эти слова в JSON
      </label>
      <label class="modal-checkbox-label">
        <input type="checkbox" id="modal-chk-delete" checked> 🗑️ Удалить их из локальной базы
      </label>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeDeleteModal()">Отмена</button>
        <button class="btn-modal-confirm" onclick="processLearnedWords()">Выполнить</button>
      </div>
    </div>
  </div>

  <div id="screen-match" class="screen hidden">
    <div class="header">
      <button class="btn-exit" onclick="finishSession()">Завершить</button>
      <div style="color: #ffc800" id="match-timer">90</div>
      <div style="color: #58cc02" id="match-score">0</div>
    </div>
    <div class="grid" id="match-grid"></div>
  </div>

  <div id="screen-quiz" class="screen hidden">
    <div class="header">
      <button class="btn-exit" onclick="finishSession()">Завершить</button>
      <button class="btn-dir" id="quiz-hint-btn" onclick="toggleQuizHint()">💡 Подсказка: ВКЛ</button>
      <button class="btn-dir" id="quiz-dir-btn" onclick="toggleDir('quiz')">⇄ A ➔ B</button>
    </div>
    <div class="quiz-prompt" id="quiz-prompt">Word</div>
    <div class="quiz-options" id="quiz-options"></div>
  </div>


  <div id="screen-cards" class="screen hidden">
    <div class="header">
      <button class="btn-exit" onclick="finishSession()">Завершить</button>
      <button class="btn-dir" id="cards-dir-btn" onclick="toggleDir('cards')">⇄ A ➔ B</button>
    </div>
    <div class="flash-stats" id="flash-stats">показано 0 карточек</div>
    <div class="flash-card" id="flash-card-el" onclick="flipCard()">
      <div class="flash-word" id="flash-text">...</div>
      <div class="flash-sub" id="flash-sub">Нажмите, чтобы перевернуть</div>
    </div>
    <div class="flash-controls" id="flash-controls">
      <button class="btn btn-skip" onclick="skipFlashCard()">Пропустить</button>
      <button class="btn btn-exact" onclick="answerFlashExact()">Точно знаю</button>
      <div class="flash-controls-row">
        <button class="btn btn-dont" onclick="answerFlash(false)">Не знаю</button>
        <button class="btn btn-know" onclick="answerFlash(true)">Знаю</button>
      </div>
    </div>
  </div>

  <div id="screen-input" class="screen hidden">
    <div class="header">
      <button class="btn-exit" onclick="finishSession()">Завершить</button>
      <button class="btn-dir" id="input-dir-btn" onclick="toggleDir('input')">⇄ A ➔ B</button>
    </div>
    <div class="quiz-prompt" id="input-prompt">Word</div>
    <input type="text" class="input-field" id="type-input" placeholder="Введите перевод..." autocomplete="off">
    <button class="btn" onclick="checkTypedAnswer()">ПРОВЕРИТЬ</button>
  </div>

<script>
  let DICTIONARIES = {}, CURRENT_DICT_NAME = '', WORD_PAIRS = [], STORAGE_KEY = 'mm_multi_dicts_data', CURRENT_DICT_KEY = 'mm_current_dict_name';
  let matchTimer, fillTimeout, currentLeft, currentRight, selectedLeft, selectedRight, matchScore, currentQuizPair, currentFlashPair, isFlipped = false, currentInputPair;
  let matchedCountInBatch = 0, pendingSlots = [];
  let directions = { quiz: 'AB', cards: 'AB', input: 'AB' };
  let showQuizHint = true;
  let cardsShownCount = 0, cardsKnownThisSession = new Set(), cardsFailCount = new Map(), cardsCooldown = [], cardsSkippedThisSession = new Set();
  let activeQuizTarget, quizAnswered = false, activeFlashCardData, activeInputTarget;

  window.addEventListener('DOMContentLoaded', () => { const savedDicts = localStorage.getItem(STORAGE_KEY); if (savedDicts) { try { DICTIONARIES = JSON.parse(savedDicts); } catch(e){} } removeEmptyDictionaries(); const lastActive = localStorage.getItem(CURRENT_DICT_KEY); updateDictSelectOptions(); if (lastActive && DICTIONARIES[lastActive]) { switchDictionary(lastActive); } else if (Object.keys(DICTIONARIES).length > 0) { switchDictionary(Object.keys(DICTIONARIES)[0]); } else { updateMenuStatus('Загрузите JSON со словами'); } });
  
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveToStorage(); });

  function removeEmptyDictionaries() { Object.keys(DICTIONARIES).forEach(name => { if (!DICTIONARIES[name] || DICTIONARIES[name].length === 0) { delete DICTIONARIES[name]; } }); }
  function saveToStorage() { removeEmptyDictionaries(); if (CURRENT_DICT_NAME && WORD_PAIRS.length >= 0) { DICTIONARIES[CURRENT_DICT_NAME] = WORD_PAIRS; } localStorage.setItem(STORAGE_KEY, JSON.stringify(DICTIONARIES)); localStorage.setItem(CURRENT_DICT_KEY, CURRENT_DICT_NAME); }
  function updateDictSelectOptions() { const select = document.getElementById('dict-select'); select.innerHTML = ''; const names = Object.keys(DICTIONARIES); if (names.length === 0) { select.innerHTML = '<option value="" disabled selected>— Нет загруженных словарей —</option>'; return; } names.forEach(name => { const opt = document.createElement('option'); opt.value = name; opt.innerText = `📖 ${name} (${DICTIONARIES[name].length} слов)`; if (name === CURRENT_DICT_NAME) opt.selected = true; select.appendChild(opt); }); }
  function switchDictionary(name) { if (!DICTIONARIES[name]) return; CURRENT_DICT_NAME = name; WORD_PAIRS = DICTIONARIES[name]; localStorage.setItem(CURRENT_DICT_KEY, CURRENT_DICT_NAME); updateDictSelectOptions(); updateMenuStatus(`Словарь: "${name}" (${WORD_PAIRS.length} слов)`); }
  
  function finishSession() { if (matchTimer) clearInterval(matchTimer); if (fillTimeout) clearTimeout(fillTimeout); saveToStorage(); showScreen('screen-menu'); }
  function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); if (CURRENT_DICT_NAME) updateMenuStatus(`Словарь: "${CURRENT_DICT_NAME}" (${WORD_PAIRS.length} слов)`); }
  function updateMenuStatus(msg) { document.getElementById('menu-status').innerText = msg; }
  
  function openDeleteModal() { if (!CURRENT_DICT_NAME) return alert('Сначала выберите или загрузите словарь'); document.getElementById('modal-delete').classList.remove('hidden'); }
  function closeDeleteModal() { document.getElementById('modal-delete').classList.add('hidden'); }
  
  function processLearnedWords() { const nCount = parseInt(document.getElementById('modal-n-count').value, 10); if (isNaN(nCount) || nCount < 0) return alert('Введите корректное число >= 0'); const doExport = document.getElementById('modal-chk-export').checked, doDelete = document.getElementById('modal-chk-delete').checked; if (!doExport && !doDelete) return alert('Выберите хотя бы одно действие (выгрузка или удаление)'); const targetWords = WORD_PAIRS.filter(p => p[2] >= nCount); if (targetWords.length === 0) return alert(`Не найдено слов с рейтингом ответов >= ${nCount}`); if (doExport) downloadCustomJSON(targetWords, `${CURRENT_DICT_NAME}_learned_top${nCount}.json`); if (doDelete) { WORD_PAIRS = WORD_PAIRS.filter(p => p[2] < nCount); DICTIONARIES[CURRENT_DICT_NAME] = WORD_PAIRS; removeEmptyDictionaries(); const keys = Object.keys(DICTIONARIES); if (keys.length > 0) { if (!DICTIONARIES[CURRENT_DICT_NAME]) switchDictionary(keys[0]); else updateDictSelectOptions(); } else { CURRENT_DICT_NAME = ''; WORD_PAIRS = []; updateDictSelectOptions(); updateMenuStatus('Все словари пусты'); } saveToStorage(); } closeDeleteModal(); alert(`Обработано слов: ${targetWords.length}`); }
  
  function downloadCustomJSON(data, filename) { const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); const downloadAnchor = document.createElement('a'); downloadAnchor.href = URL.createObjectURL(blob); downloadAnchor.download = filename; document.body.appendChild(downloadAnchor); downloadAnchor.click(); setTimeout(() => { document.body.removeChild(downloadAnchor); URL.revokeObjectURL(downloadAnchor.href); }, 100); }

  function loadFile(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (evt) => parseAndSaveDict(evt.target.result, file.name.replace(/\.[^/.]+$/, "")); reader.readAsText(file); e.target.value = ''; }
  function parseInputText(text) { if (!text.trim()) return; parseAndSaveDict(text, 'Мой словарь'); document.getElementById('text-input').value = ''; }

  function parseAndSaveDict(text, fallbackName) { try { const data = JSON.parse(text); if (data && typeof data === 'object' && !Array.isArray(data)) { let c = 0; Object.keys(data).forEach(k => { if (Array.isArray(data[k]) && data[k].length > 0) { DICTIONARIES[k] = data[k]; c++; } }); removeEmptyDictionaries(); if (c > 0) { const firstKey = Object.keys(DICTIONARIES)[0]; if (firstKey) switchDictionary(firstKey); saveToStorage(); alert(`Импортирован бэкап! Словарей: ${c}`); return; } } if (Array.isArray(data)) { const pairs = data.map(i => (i && typeof i === 'object' && !Array.isArray(i) && i.left && i.right) ? [String(i.left).trim(), String(i.right).trim(), i.score || 0] : (Array.isArray(i) && i.length >= 2 ? [String(i[0]).trim(), String(i[1]).trim(), i[2] || 0] : null)).filter(Boolean); if (pairs.length >= 1) { const name = prompt('Введите название для словаря:', fallbackName); if (name === null) return; const finalName = name.trim() || fallbackName; DICTIONARIES[finalName] = pairs; removeEmptyDictionaries(); switchDictionary(finalName); saveToStorage(); alert(`Словарь "${finalName}" сохранен! Пар: ${pairs.length}`); return; } } } catch(e){} alert('Ошибка форматирования JSON'); }
  
  function applyScoreChange(pair, isCorrect) { let currentScore = pair[2]; if (isCorrect) { pair[2] = Math.min(50, currentScore + 1); } else { if (currentScore > 0) { pair[2] = 0; } else if (currentScore === 0) { pair[2] = -5; } else { pair[2] = Math.max(-10, currentScore - 1); } } saveToStorage(); }

  function getActivePairs() { return WORD_PAIRS.filter(p => p[2] < 40); }
  function getRandomPair(excludePairs = []) { const active = getActivePairs().filter(p => !excludePairs.includes(p)); const pool = active.length > 0 ? active : getActivePairs(); if (pool.length === 0) return WORD_PAIRS[0]; const minScore = Math.min(...pool.map(p => p[2])), weights = pool.map(p => Math.exp((minScore - p[2]) / 3)); let rand = Math.random() * weights.reduce((a, b) => a + b, 0); for (let i = 0; i < pool.length; i++) { rand -= weights[i]; if (rand <= 0) return pool[i]; } return pool[0]; }
  function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  function startMode(mode) { if (!CURRENT_DICT_NAME || WORD_PAIRS.length === 0) return alert('Загрузите или выберите словарь!'); const active = getActivePairs(); if (active.length < 1) return alert('Все слова в этом словаре изучены!'); if (mode === 'match' && active.length < 5) return alert('Для режима "Пары" нужно минимум 5 неизученных слов!'); if (mode === 'match') initMatch(); if (mode === 'quiz') initQuiz(); if (mode === 'cards') initCards(); if (mode === 'input') initInputMode(); }
  function toggleDir(mode) { const states = ['AB', 'BA', 'RANDOM'], labels = { AB: '⇄ A ➔ B', BA: '⇄ B ➔ A', RANDOM: '🔀 Микс' }; directions[mode] = states[(states.indexOf(directions[mode]) + 1) % states.length]; document.getElementById(`${mode}-dir-btn`).innerText = labels[directions[mode]]; if (mode === 'quiz') nextQuizQuestion(); if (mode === 'cards') nextFlashCard(); if (mode === 'input') nextInputQuestion(); }
  function toggleQuizHint() { showQuizHint = !showQuizHint; document.getElementById('quiz-hint-btn').innerText = showQuizHint ? '💡 Подсказка: ВКЛ' : '💡 Подсказка: ВЫКЛ'; }
  function getDirPair(pair, mode) { let modeDir = directions[mode], isAB = modeDir === 'AB' ? true : (modeDir === 'BA' ? false : Math.random() < 0.5); return isAB ? { q: pair[0], a: pair[1] } : { q: pair[1], a: pair[0] }; }
  function getSimilarity(s1, s2) { let str1 = s1.toLowerCase().trim(), str2 = s2.toLowerCase().trim(); if (str1 === str2) return 1.0; let l1 = str1.length, l2 = str2.length; if (l1 === 0 || l2 === 0) return 0; let matrix = Array(l2 + 1).fill(null).map(() => Array(l1 + 1).fill(null)); for (let i = 0; i <= l1; i++) matrix[0][i] = i; for (let j = 0; j <= l2; j++) matrix[j][0] = j; for (let j = 1; j <= l2; j++) { for (let i = 1; i <= l1; i++) { let cost = str1[i - 1] === str2[j - 1] ? 0 : 1; matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + cost); } } return (Math.max(l1, l2) - matrix[l2][l1]) / Math.max(l1, l2); }
  
  function initMatch() { showScreen('screen-match'); matchScore = 0; let timeLeft = 90; matchedCountInBatch = 0; pendingSlots = []; if (fillTimeout) clearTimeout(fillTimeout); document.getElementById('match-score').innerText = matchScore; document.getElementById('match-timer').innerText = timeLeft; const initial = []; const active = getActivePairs(); for(let i=0; i<5; i++) { const available = active.filter(p => initial.filter(x => x === p).length < 2); const picked = available.length > 0 ? available[Math.floor(Math.random() * available.length)] : getRandomPair(); initial.push(picked); } currentLeft = shuffle(initial.map(p => ({ text: p[0], pairRef: p }))); currentRight = shuffle(initial.map(p => ({ text: p[1], pairRef: p }))); selectedLeft = null; selectedRight = null; renderMatchGrid(); clearInterval(matchTimer); matchTimer = setInterval(() => { timeLeft--; document.getElementById('match-timer').innerText = timeLeft; if (timeLeft <= 0) { finishSession(); alert(`Время вышло! Очки: ${matchScore}`); } }, 1000); }
  function renderMatchGrid() { const grid = document.getElementById('match-grid'); grid.innerHTML = ''; for (let i = 0; i < 5; i++) { grid.appendChild(createMatchCard(currentLeft[i], 'left', i)); grid.appendChild(createMatchCard(currentRight[i], 'right', i)); } }
  
  function fillPendingSlots() { if (pendingSlots.length === 0) return; const count = pendingSlots.length; const currentOnBoard = [...currentLeft.map(x => x?.pairRef), ...currentRight.map(x => x?.pairRef)].filter(Boolean); const overused = currentOnBoard.filter(p => currentOnBoard.filter(x => x === p).length >= 2); const newPairs = []; for (let i = 0; i < count; i++) { newPairs.push(getRandomPair([...overused, ...newPairs])); } const shuffledRightNew = shuffle([...newPairs]); pendingSlots.forEach((slot, i) => { const pairLeft = newPairs[i]; const pairRight = shuffledRightNew[i]; currentLeft[slot.lIdx] = { text: pairLeft[0], pairRef: pairLeft }; currentRight[slot.rIdx] = { text: pairRight[1], pairRef: pairRight }; const cards = document.querySelectorAll('.card-match'); cards[slot.lIdx * 2].replaceWith(createMatchCard(currentLeft[slot.lIdx], 'left', slot.lIdx)); cards[slot.rIdx * 2 + 1].replaceWith(createMatchCard(currentRight[slot.rIdx], 'right', slot.rIdx)); }); matchedCountInBatch = 0; pendingSlots = []; }

  function createMatchCard(item, side, index) { const card = document.createElement('div'); card.className = 'card-match'; if (!item) { card.style.visibility = 'hidden'; return card; } card.innerText = item.text; card.dataset.side = side; card.dataset.index = index; card.onclick = () => { if (card.classList.contains('cooldown') || card.classList.contains('correct') || card.style.visibility === 'hidden') return; if (side === 'left') { if (selectedLeft) document.querySelectorAll('.card-match')[selectedLeft.index * 2]?.classList.remove('selected'); selectedLeft = { index, item, el: card }; } else { if (selectedRight) document.querySelectorAll('.card-match')[selectedRight.index * 2 + 1]?.classList.remove('selected'); selectedRight = { index, item, el: card }; } card.classList.add('selected'); if (selectedLeft && selectedRight) { const isMatch = selectedLeft.item.pairRef === selectedRight.item.pairRef, lEl = selectedLeft.el, rEl = selectedRight.el, lIdx = selectedLeft.index, rIdx = selectedRight.index; if (isMatch) { lEl.className = 'card-match correct cooldown'; rEl.className = 'card-match correct cooldown'; applyScoreChange(selectedLeft.item.pairRef, true); matchScore += 10; document.getElementById('match-score').innerText = matchScore; const curLIdx = lIdx, curRIdx = rIdx; selectedLeft = null; selectedRight = null; setTimeout(() => { lEl.style.visibility = 'hidden'; rEl.style.visibility = 'hidden'; lEl.classList.remove('correct', 'cooldown', 'selected'); rEl.classList.remove('correct', 'cooldown', 'selected'); currentLeft[curLIdx] = null; currentRight[curRIdx] = null; pendingSlots.push({ lIdx: curLIdx, rIdx: curRIdx }); matchedCountInBatch++; if (fillTimeout) clearTimeout(fillTimeout); if (matchedCountInBatch >= 3) { fillPendingSlots(); } else { fillTimeout = setTimeout(() => { fillPendingSlots(); }, 2000); } }, 200); } else { lEl.className = 'card-match wrong'; rEl.className = 'card-match wrong'; applyScoreChange(selectedLeft.item.pairRef, false); applyScoreChange(selectedRight.item.pairRef, false); const curL = selectedLeft, curR = selectedRight; selectedLeft = null; selectedRight = null; setTimeout(() => { if (curL.el) curL.el.className = 'card-match'; if (curR.el) curR.el.className = 'card-match'; }, 250); } } }; return card; }
  
  function initQuiz() { showScreen('screen-quiz'); nextQuizQuestion(); }
  function nextQuizQuestion() { quizAnswered = false; currentQuizPair = getRandomPair(); let pairData = getDirPair(currentQuizPair, 'quiz'); activeQuizTarget = pairData.a; document.getElementById('quiz-prompt').innerText = pairData.q; let wrongOptions = shuffle(WORD_PAIRS.filter(p => p !== currentQuizPair).map(p => (pairData.q === currentQuizPair[0] ? p[1] : p[0]))).slice(0, 3); const optsContainer = document.getElementById('quiz-options'); optsContainer.innerHTML = ''; shuffle([pairData.a, ...wrongOptions]).forEach(optText => { const btn = document.createElement('div'); btn.className = 'quiz-opt'; btn.innerText = optText; btn.onclick = () => { if (quizAnswered) return; quizAnswered = true; if (optText === activeQuizTarget) { btn.classList.add('correct'); applyScoreChange(currentQuizPair, true); setTimeout(nextQuizQuestion, 300); } else { btn.classList.add('wrong'); applyScoreChange(currentQuizPair, false); if (showQuizHint) { Array.from(optsContainer.children).forEach(child => { if (child.innerText === activeQuizTarget) child.classList.add('correct'); }); setTimeout(nextQuizQuestion, 1000); } else { setTimeout(nextQuizQuestion, 400); } } }; optsContainer.appendChild(btn); }); }
  
  function initCards() { cardsShownCount = 0; cardsKnownThisSession.clear(); cardsFailCount.clear(); cardsCooldown = []; cardsSkippedThisSession.clear(); document.getElementById('flash-controls').style.display = 'flex'; document.getElementById('flash-card-el').style.pointerEvents = 'auto'; showScreen('screen-cards'); nextFlashCard(); }
  function getAvailableCards() { return getActivePairs().filter(p => !cardsKnownThisSession.has(p) && (cardsFailCount.get(p) || 0) < 3 && !cardsSkippedThisSession.has(p)); }
  function nextFlashCard() { isFlipped = false; let available = getAvailableCards(), candidatePool = available.filter(p => !cardsCooldown.includes(p)); if (candidatePool.length === 0) candidatePool = available; if (candidatePool.length === 0) { document.getElementById('flash-text').innerText = "🎉 Все доступные карточки пройдены!"; document.getElementById('flash-sub').innerText = "Нажмите «Завершить» для выхода"; document.getElementById('flash-controls').style.display = 'none'; document.getElementById('flash-card-el').style.pointerEvents = 'none'; document.getElementById('flash-stats').innerText = `показано ${cardsShownCount} карточек`; return; } const minScore = Math.min(...candidatePool.map(p => p[2])), weights = candidatePool.map(p => Math.exp((minScore - p[2]) / 3)); let rand = Math.random() * weights.reduce((a, b) => a + b, 0); currentFlashPair = candidatePool[0]; for (let i = 0; i < candidatePool.length; i++) { rand -= weights[i]; if (rand <= 0) { currentFlashPair = candidatePool[i]; break; } } cardsCooldown.push(currentFlashPair); if (cardsCooldown.length > 5) cardsCooldown.shift(); activeFlashCardData = getDirPair(currentFlashPair, 'cards'); document.getElementById('flash-text').innerText = activeFlashCardData.q; document.getElementById('flash-sub').innerText = 'Нажмите, чтобы перевернуть'; document.getElementById('flash-stats').innerText = `показано ${cardsShownCount} карточек`; }
  function flipCard() { isFlipped = !isFlipped; document.getElementById('flash-text').innerText = isFlipped ? activeFlashCardData.a : activeFlashCardData.q; document.getElementById('flash-sub').innerText = isFlipped ? 'Перевод' : 'Слово'; }
  function answerFlash(knows) { if (!currentFlashPair) return; cardsShownCount++; if (knows) { applyScoreChange(currentFlashPair, true); cardsKnownThisSession.add(currentFlashPair); } else { applyScoreChange(currentFlashPair, false); cardsFailCount.set(currentFlashPair, (cardsFailCount.get(currentFlashPair) || 0) + 1); } nextFlashCard(); }
  function answerFlashExact() { if (!currentFlashPair) return; cardsShownCount++; currentFlashPair[2] = 40; cardsKnownThisSession.add(currentFlashPair); nextFlashCard(); }
  function skipFlashCard() { if (!currentFlashPair) return; cardsShownCount++; cardsSkippedThisSession.add(currentFlashPair); nextFlashCard(); }

  function initInputMode() { showScreen('screen-input'); const inp = document.getElementById('type-input'); inp.onkeydown = (e) => { if (e.key === 'Enter') checkTypedAnswer(); }; nextInputQuestion(); }
  function nextInputQuestion() { currentInputPair = getRandomPair(); let pairData = getDirPair(currentInputPair, 'input'); activeInputTarget = pairData.a; document.getElementById('input-prompt').innerText = pairData.q; const inp = document.getElementById('type-input'); inp.value = ''; inp.style.borderColor = '#37464f'; inp.disabled = false; setTimeout(() => inp.focus(), 100); }
  function checkTypedAnswer() { const inp = document.getElementById('type-input'); if (inp.disabled) return; const val = inp.value.trim(), correctTarget = activeInputTarget, similarity = getSimilarity(val, correctTarget); if (similarity === 1.0) { inp.style.borderColor = '#58cc02'; applyScoreChange(currentInputPair, true); setTimeout(nextInputQuestion, 300); } else if (similarity >= 0.75) { inp.disabled = true; inp.style.borderColor = '#ffc800'; inp.value = `${val} ➔ Правильно: ${correctTarget}`; setTimeout(nextInputQuestion, 1500); } else { inp.disabled = true; inp.style.borderColor = '#ea2b2b'; applyScoreChange(currentInputPair, false); inp.value = `Ошибка! Правильно: ${correctTarget}`; setTimeout(nextInputQuestion, 1800); } }
  
  function exportJSON() { if (Object.keys(DICTIONARIES).length === 0) return alert('Нет ни одного словаря для выгрузки'); saveToStorage(); downloadCustomJSON(DICTIONARIES, `all_dictionaries_backup.json`); }
</script>
